name: train-pack

# Train ONE skill pack against the FROZEN trunk on free Actions compute and
# push the new pack file back. The main model is never touched.

on:
  workflow_dispatch:
    inputs:
      pack_name:
        description: "Pack name (folder-safe), e.g. knowledge"
        default: "knowledge"
      facts_file:
        description: "Facts bank path ('Q ||| A' lines)"
        default: "assets/knowledge/wiki_facts.txt"
      eval_facts:
        description: "Held-out facts bank (optional)"
        default: "assets/knowledge/wiki_facts_eval.txt"
      steps:
        description: "LM training steps"
        default: "2600"
      max_minutes:
        description: "Time budget (minutes)"
        default: "45"

permissions:
  contents: write

jobs:
  train-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install torch (CPU) + deps
        run: pip install torch numpy --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: pip install -e .
      - name: Ensure trunk exists (genesis if needed)
        run: |
          if [ ! -f ckpt/trunk.pt ]; then
            python -m skill_lm.genesis --story-mb 3.0
          fi
      - name: Train the pack (frozen trunk, expert + router only)
        run: |
          python -m skill_lm.train_pack \
            --name ${{ github.event.inputs.pack_name }} \
            --facts ${{ github.event.inputs.facts_file }} \
            --eval-facts ${{ github.event.inputs.eval_facts }} \
            --steps ${{ github.event.inputs.steps }} \
            --max-minutes ${{ github.event.inputs.max_minutes }}
      - name: LUA benchmark (zero-forgetting check included)
        run: python -m skill_lm.bench_lua || true
      - name: Export int8 pack
        run: python -m skill_lm.export_pack --pack ${{ github.event.inputs.pack_name }} || true
      - name: Commit pack back (hub update)
        run: |
          git config user.name "modular-lm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A packs/ ckpt/bench_lua.json
          git commit -m "pack: train ${{ github.event.inputs.pack_name }} @ ${{ github.event.inputs.steps }} steps (run ${{ github.run_id }})" || echo "nothing to commit"
          git pull --rebase --autostash origin main || true
          for i in 1 2 3; do git push && break || sleep 8; done
      - name: Upload pack artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack-${{ github.event.inputs.pack_name }}-${{ github.run_id }}
          path: packs/
